# Local replica-set demo only. No host database/API port. Do not expose this DB.
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          --eval,
          'try { if (rs.status().ok !== 1) quit(1); } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build: { context: .., target: api }
    environment:
      STORE_MODE: demo
      MONGODB_URI: mongodb://mongo:27017/grocery_demo?replicaSet=rs0
      WEB_ORIGIN: http://127.0.0.1:3000
    depends_on:
      mongo: { condition: service_healthy }
  web:
    build: { context: .., target: web }
    environment: { STORE_MODE: demo, API_URL: "http://api:4100" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  mongo-data:
