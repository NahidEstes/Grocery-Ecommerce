<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174d2a" />
    <title>You're offline | Grocery store</title>
    <style>
      body {
        margin: 0;
        background: #f5f8f3;
        color: #173c24;
        font:
          16px/1.7 Arial,
          "Nirmala UI",
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        box-sizing: border-box;
        background: white;
        border: 1px solid #e2eadf;
        border-radius: 24px;
        padding: 36px;
        max-width: 490px;
        margin: 24px;
        text-align: center;
      }
      img {
        width: 80px;
        border-radius: 20px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.3;
      }
      p {
        color: #536359;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 10px;
        background: #ff5b00;
        color: #fff;
        text-decoration: none;
        font-weight: bold;
      }
      .bn {
        border-top: 1px solid #e2eadf;
        padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/freshcart-192.png" alt="FreshCart" />
      <h1>Let’s get you connected.</h1>
      <p>
        You're offline. Reconnect to see current prices and stock, review your
        basket or place an order.
      </p>
      <div class="bn" lang="bn">
        <h2>আবার সংযোগ করুন</h2>
        <p>
          আপনি এখন অফলাইনে আছেন। বর্তমান দাম ও স্টক দেখতে, কার্ট যাচাই করতে বা
          অর্ডার দিতে ইন্টারনেটে সংযুক্ত হোন।
        </p>
      </div>
      <a href="/">Try again / আবার চেষ্টা করুন</a>
    </main>
  </body>
</html>
